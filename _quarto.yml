project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!_archiv/"
  resources:
    - "assets/fonts/**"
    - "dokumente/**"
    - "images/**"

lang: de

website:
  title: "J. Franz Th. Meißner"
  site-url: "https://jfthm.github.io/pro/"
  search: false
  navbar:
    collapse-below: xl
    left:
      - text: "Start"
        href: index.qmd
      - text: "Projekt"
        href: projekt.qmd
      - text: "Person"
        href: person.qmd
      - text: "Für Teilnehmende"
        href: teilnehmende.qmd
      - text: "Forschungsethik"
        href: forschungsethik.qmd
      - text: "Open Science"
        href: open-science.qmd
      - text: "Vorträge und Publikationen"
        href: vortraege-publikationen.qmd
  page-footer:
    left: |
      J. Franz Th. Meißner · [![ORCID iD](images/ORCID_iD.svg){.orcid-logo} 0009-0008-4266-0580](https://orcid.org/0009-0008-4266-0580)
      [[<i class="bi bi-github" aria-hidden="true"></i><span class="visually-hidden">GitHub</span>](https://github.com/jfthm/){.profil-icon}
      [<i class="bi bi-linkedin" aria-hidden="true"></i><span class="visually-hidden">LinkedIn</span>](https://www.linkedin.com/in/jfthm){.profil-icon}
      [<i class="bi bi-mastodon" aria-hidden="true"></i><span class="visually-hidden">Mastodon</span>](https://mastodon.berlin/@jfthm/){.profil-icon}
      [<i class="bi bi-envelope" aria-hidden="true"></i><span class="visually-hidden">E-Mail</span>](mailto:j.f.th.meissner@gmail.com){.profil-icon}]{.profil-icons}
    right: |
      [Impressum](impressum.qmd) · [Datenschutz](datenschutz.qmd)

format:
  html:
    theme:
      - default
      - assets/theme.scss
    css: assets/fonts.css
    toc: true
    toc-location: right
    toc-title: "Auf dieser Seite"
    html-math-method: plain
    link-external-newwindow: false
    anchor-sections: false

execute:
  echo: false
  warning: false
  message: false
